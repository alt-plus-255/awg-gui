name: awggui

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  caddy:
    image: awggui-caddy:__VERSION__
    container_name: awggui-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PANEL_PORT:-8877}:80"
      - "${PANEL_HTTPS_PORT:-7443}:443"
    volumes:
      - /etc/awg-gui/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/awg-gui/certs/panel:/certs:ro
    depends_on:
      - app
    networks:
      - awggui

  app:
    image: awggui-app:__VERSION__
    container_name: awggui-app
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8877}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-7}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-awggui}
      DB_USERNAME: ${DB_USERNAME:-awggui}
      DB_PASSWORD: ${DB_PASSWORD}
      DOCKER_HOST: tcp://docker-proxy:2375
      PANEL_OPS_URL: http://panel-ops:8090
      PANEL_OPS_TOKEN: ${PANEL_OPS_TOKEN}
      AWG_CONTAINER: awggui-awg
      AWG_CONFIG_DIR: /awg
      HOST_AWG_CONFIG_DIR: /var/lib/docker/volumes/awggui_awg_config/_data
      HOST_AWG_GUI_DIR: /host-awg-gui
      HOST_COMPOSE_DIR: /compose
      SERVER_ENDPOINT: ${SERVER_ENDPOINT:-auto}
      AWG_PORT: ${AWG_PORT:-51820}
      INTERNAL_SUBNET: ${INTERNAL_SUBNET:-10.66.66.0/24}
      PEER_DNS: ${PEER_DNS:-1.1.1.1}
      ALLOWED_IPS: ${ALLOWED_IPS:-0.0.0.0/0, ::/0}
      PERSISTENT_KEEPALIVE: ${PERSISTENT_KEEPALIVE:-25}
      PANEL_PORT: ${PANEL_PORT:-8877}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-7443}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      TZ: ${TZ:-UTC}
    volumes:
      - awg_config:/awg
      - /proc:/host/proc:ro
      - /etc/awg-gui:/host-awg-gui
      - .:/compose:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    networks:
      - awggui

  db:
    image: mariadb:11.4
    container_name: awggui-db
    restart: unless-stopped
    logging: *default-logging
    # Default MariaDB caches (~128M InnoDB + ~128M Aria + ~128M MyISAM key buffer)
    # idle at 300–400MB+. These flags target ~80–120MB RSS on a small panel VPS.
    command:
      - mariadbd
      - --innodb-buffer-pool-size=32M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --aria-pagecache-buffer-size=8M
      - --key-buffer-size=1M
      - --max-connections=32
      - --table-open-cache=64
      - --table-definition-cache=64
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --join-buffer-size=256K
      - --thread-cache-size=8
      - --performance-schema=OFF
      - --skip-name-resolve
      - --skip-log-bin
    mem_limit: 192m
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-awggui}
      MARIADB_USER: ${DB_USERNAME:-awggui}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - awggui

  awg:
    image: awggui-awg:__VERSION__
    container_name: awggui-awg
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - awg_config:/config
    ports:
      - "51820-51839:51820-51839/udp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      # TPROXY to 127.0.0.1 requires route_localnet on lo (all alone is not enough).
      - net.ipv4.conf.all.route_localnet=1
      - net.ipv4.conf.default.route_localnet=1
      # Set at container create time (runtime sysctl from inside is often denied).
      - net.ipv4.conf.lo.route_localnet=1
      # Do NOT set net.core.rmem_max/wmem_max or tcp_rmem/wmem/bbr here:
      # modern runc rejects them ("unsafe procfs") and the awg container fails to start.
    networks:
      - awggui

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: awggui-docker-proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      LOGS: 1
      CONTAINERS_CREATE: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      COMMIT: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - awggui

  panel-ops:
    image: awggui-panel-ops:__VERSION__
    container_name: awggui-panel-ops
    restart: unless-stopped
    logging: *default-logging
    environment:
      PANEL_OPS_TOKEN: ${PANEL_OPS_TOKEN}
      COMPOSE_PROJECT: awggui
      COMPOSE_FILE: /compose/docker-compose.yml
      COMPOSE_ENV_FILE: /compose/.env
    volumes:
      - /etc/awg-gui:/host-awg-gui
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    networks:
      - awggui

networks:
  awggui:
    name: awggui_net

volumes:
  db_data:
    name: awggui_db_data
  awg_config:
    name: awggui_awg_config
